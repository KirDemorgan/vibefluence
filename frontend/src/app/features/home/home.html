<main class="home">
  <h1 class="home__title">Vibefluence</h1>
  <p class="home__subtitle">Markdown documentation for your repositories</p>

  <p class="home__status" role="status" [attr.data-state]="state()">
    @switch (state()) {
      @case ('checking') {
        Checking the service…
      }
      @case ('ok') {
        Service is up
      }
      @case ('unavailable') {
        Service is unavailable
      }
    }
  </p>

  <button tuiButton type="button" appearance="secondary" size="m" (click)="refresh()">
    Check again
  </button>
</main>
